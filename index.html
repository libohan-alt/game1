<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>game1</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #popup-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 999;
        }
        .popup-box {
            background: #1e1e1e; padding: 50px; border-radius: 16px; text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); max-width: 450px;
            border: 1px solid #333;
        }
        .popup-box h1 {
            margin-top: 0; color: #fff; font-size: 32px; letter-spacing: 2px;
        }
        .popup-box p {
            color: #aaa; font-size: 18px; line-height: 1.8; margin-bottom: 35px;
        }
        .popup-box p b {
            color: #d29922; /* 棕色偏橙，看起来像苹果 */
            font-size: 22px;
            display: inline-block;
            margin: 10px 0;
        }
        .popup-box button {
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            background: #ff4757; color: #fff;
            border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .popup-box button:hover {
            background: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }
    </style>
</head>
<body>
<div id="popup-overlay">
    <div class="popup-box">
        <h1>Newbie Guide</h1>
        <p>
            Your mission is simple.<br>
            Move with arrow keys and <b>Eat the brown apples.</b>
        </p>
        <button id="popup-btn">Just Do It!</button>
    </div>
</div>
<script type="module" src="index.js"></script>
<script>
    const popup = document.getElementById('popup-overlay');
    const popupBtn = document.getElementById('popup-btn');
    let isPlaying = false;
    window.addEventListener('keydown', (e) => {
        if (!isPlaying) {
            e.stopImmediatePropagation();
            e.preventDefault();
        }
    }, true);
    popupBtn.addEventListener('click', () => {
        popup.style.display = 'none';
        isPlaying = true;
    });
</script>
</body>
</html>
